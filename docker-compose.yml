version: '3.8'

services:

  backend:
    build:
      context: ./inventory-backend
    ports:
      - "8000:8000"
    volumes:
      - ./inventory-backend:/app
    env_file:
      - ./inventory-backend/.env

  frontend:
    build:
      context: ./inventory-frontend

    ports:
      - "5173:5173"
    volumes:
      - ./inventory-frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true